# Invoisio — Mainnet deployment manifest
#
# All secret values (keys, seeds) must be supplied via environment variables.
# Never commit real private keys or secret seeds to this file.
#
# Usage:
#   STELLAR_NETWORK=mainnet INVOISIO_ADMIN_SECRET=S... ./deploy.sh
#
# Required environment variables (set before running deploy.sh):
#   INVOISIO_ADMIN_SECRET   — secret key for the admin identity (required on mainnet;
#                             no Friendbot funding is available)

[network]
name        = "mainnet"
passphrase  = "Public Global Stellar Network ; September 2015"
rpc_url     = "https://mainnet.sorobanrpc.com"
horizon_url = "https://horizon.stellar.org"
# No friendbot on mainnet — admin account must be pre-funded.

[identity]
# Name of the local stellar keys identity to use.
# Create with: stellar keys generate --global invoisio-admin-mainnet
name = "invoisio-admin-mainnet"
# Secret key injected from env at deploy time.
secret_key_env = "INVOISIO_ADMIN_SECRET"

[contract]
wasm_path        = "target/wasm32v1-none/release/invoice_payment.wasm"
contract_id_file = "contracts/invoice-payment/.contract-id-mainnet"
# Address that MUST end up as the contract admin (issue #529).
#
# Deployment and initialisation are a single transaction: deploy.sh passes the
# admin as a constructor argument, so the contract is never on the ledger
# without an admin and the role cannot be front-run. There is deliberately no
# separate initialise step to run afterwards.
#
# Set this to the G-address the mainnet admin identity is expected to resolve
# to. deploy.sh refuses to deploy if the local identity resolves to a different
# address, and refuses to hand over the deployment if the admin read back from
# the contract does not match. Leave it empty to fall back to whatever the
# identity above resolves to (acceptable on testnet, not on mainnet).
expected_admin = ""

[assets]
# Allowlist of accepted payment assets on mainnet.
# Format: CODE:ISSUER  (use "native" for XLM)
# USDC on mainnet issued by Centre.
allowlist = [
  "native",
  "USDC:GA5ZSEJYB37JRC5AVCIA5MOP4RHTM335X2KGX3IHOJAPP5RE34K4KZVN",
]

# Mainnet deployment checklist:
#   1. Build the WASM:         ./build.sh
#   2. Verify the WASM hash before deploying (check with the team).
#   3. Ensure the admin account has enough XLM for fees + rent.
#   4. Set expected_admin above to the agreed admin G-address.
#   5. Run:  STELLAR_NETWORK=mainnet INVOISIO_ADMIN_SECRET=S... ./deploy.sh
#      This deploys and installs the admin in ONE transaction and then reads
#      the admin back. Never split it into a deploy followed by a separate
#      initialize: between the two, anyone watching the ledger can claim the
#      admin role, and the role is not recoverable (propose_admin requires the
#      current admin's authorisation, and there is no reset path).
#   6. Confirm the script printed "Verified: contract admin is <expected>".
#      If it did not, the deployment is not safe to use — redeploy.
#   7. Commit the resulting .contract-id-mainnet file to git.
#
# Mainnet upgrade checklist (in-place, existing contract ID — no redeploy):
#   Full procedure, ordering rationale, and rollback expectations:
#   docs/upgrade-runbook.md
#   1. Dry-run first:
#        STELLAR_NETWORK=mainnet ./invoke-upgrade.sh <path-to-new.wasm> <new_version> --dry-run
#   2. STELLAR_NETWORK=mainnet ./invoke-pause.sh
#   3. STELLAR_NETWORK=mainnet ./invoke-upgrade.sh <path-to-new.wasm> <new_version>
#   4. STELLAR_NETWORK=mainnet ./invoke-upgrade-storage.sh
#   5. STELLAR_NETWORK=mainnet ./invoke-inspect-config.sh   (verify before unpausing)
#   6. STELLAR_NETWORK=mainnet ./invoke-unpause.sh
