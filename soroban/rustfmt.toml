# Rustfmt configuration for Invoisio contract
# Only stable options are used here

edition = "2021"
max_width = 100
hard_tabs = false
tab_spaces = 4
newline_style = "Unix"
use_small_heuristics = "Default"

# Import grouping (stable)
reorder_imports = true
reorder_modules = true

# Match arms (stable)
match_block_trailing_comma = true

# Other stable options
use_field_init_shorthand = true
use_try_shorthand = true
