name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

env:
  MERCHANT_PUBLIC_KEY: ${{ secrets.MERCHANT_PUBLIC_KEY || 'placeholder' }}

jobs:
  lint-and-test:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: ""
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
        run: npx prisma generate

      - name: Install psql client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Wait for Postgres to be ready
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
        run: |
          echo "Waiting for Postgres to become available..."
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 && break || sleep 1
          done
          pg_isready -h localhost -p 5432 || (echo "Postgres not ready" && exit 1)

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
        run: npx prisma migrate deploy

      - name: Apply non-blocking DB indexes
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
        run: |
          chmod +x scripts/run_non_blocking_migrations.sh || true
          scripts/run_non_blocking_migrations.sh

      - name: Run Linter
        run: npm run lint

      - name: Run Format Check
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Run Unit Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
          MERCHANT_PUBLIC_KEY: ${{ env.MERCHANT_PUBLIC_KEY }}
        run: npm run test

      - name: Run E2E Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
          MERCHANT_PUBLIC_KEY: ${{ env.MERCHANT_PUBLIC_KEY }}
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          REDIS_DB: 1
          JWT_SECRET: e2e-test-secret
        run: npm run test:e2e

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb?schema=public
        run: npm run build

      - name: Upload Coverage Reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7
