name: Soroban Contract CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'soroban/**'
      - '.github/workflows/soroban.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main" ]
    paths:
      - 'soroban/**'
      - '.github/workflows/soroban.yml'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soroban

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Ensure Rust toolchain & components (with retries)
        run: |
          retry() {
            local n=1
            local max=5
            local delay=5
            until "$@" ; do
              if [ $n -ge $max ] ; then
                echo "Command failed after $n attempts: $*"
                return 1
              fi
              echo "Command failed. Attempt $n/$max:"
              n=$((n+1))
              sleep $delay
            done
          }
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          retry rustup toolchain install stable --no-self-update
          retry rustup component add cargo --toolchain stable
          retry rustup target add wasm32-unknown-unknown --toolchain stable
        shell: bash

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: soroban

      - name: Run Tests
        run: cargo test

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Check Rust Schema Drift
        run: |
          cd contracts/invoice-payment
          make schema
          git diff --exit-code schema.json

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v27.1.0

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Check TS Bindings Drift
        run: |
          cd client
          npm run generate
          git diff --exit-code src/generated

      - name: Typecheck TypeScript Client
        run: |
          cd client
          npm run typecheck
