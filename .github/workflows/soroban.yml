name: Soroban Contract CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'soroban/**'
      - '.github/workflows/soroban.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main" ]
    paths:
      - 'soroban/**'
      - '.github/workflows/soroban.yml'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soroban

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: soroban

      - name: Run Tests
        run: cargo test

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Check Rust Schema Drift
        run: |
          cd contracts/invoice-payment
          make schema
          git diff --exit-code schema.json

      - name: Install Stellar CLI
        uses: stellar/actions/setup-cli@main

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Check TS Bindings Drift
        run: |
          cd client
          npm run generate
          git diff --exit-code src/generated

      - name: Typecheck TypeScript Client
        run: |
          cd client
          npm run typecheck
