name: Soroban Contract CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'soroban/**'
      - '.github/workflows/soroban.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ "main" ]
    paths:
      - 'soroban/**'
      - '.github/workflows/soroban.yml'

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soroban

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: soroban

      - name: Run Tests
        run: cargo test

      - name: Guard against stale migration helper enumeration
        run: |
          if [ -e contracts/invoice-payment/src/migration_helpers.rs ] || \
             grep -R "migration_helpers" -n contracts/invoice-payment/src; then
            echo "::error::Remove stale migration_helpers module; payment enumeration must use migration.rs PaymentLog/get_payment path."
            exit 1
          fi

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --release

  abi-drift:
    name: ABI Drift Check (contract ⇄ schema.json ⇄ TS client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./soroban

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate schema.json from the contract and fail on drift
        run: |
          cd contracts/invoice-payment
          ./generate-schema.sh
          if ! git diff --exit-code -- schema.json; then
            echo "::error::soroban/contracts/invoice-payment/schema.json is out of date." \
              "Run 'make schema' (or ./generate-schema.sh from contracts/invoice-payment/)" \
              "and commit the result."
            exit 1
          fi

      - name: Check TypeScript client against schema.json
        run: node scripts/check-client-drift.mjs
